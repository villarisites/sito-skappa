<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Cabina — prototipo SKAPPA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Days+One&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="cabin.css" />
</head>
<body>

  <!-- La scena. Tutto quello che sta dentro .camera vive nello stesso spazio 3D. -->
  <main class="cabina-scroll" id="cabinaScroll" aria-label="Scegli la tua destinazione">
  <div class="scena" id="scena">
    <div class="camera" id="camera">
      <div class="mondi" id="mondi"></div>
      <div class="parete" id="parete"></div>
      <div class="cappelliera" id="cappelliera" aria-hidden="true"></div>
      <div class="vani" id="vani"></div>
      <div class="vetri" id="vetri"></div>
      <div class="tendine" id="tendine"></div>
      <div class="targhette" id="targhette"></div>
      <div class="sedili" id="sedili"></div>
      <div class="primo-piano"></div>
    </div>

    <!-- I link veri. Restano navigabili senza JavaScript. -->
    <a class="presa" id="presa-praga" href="arrivo.html?id=praga&amp;da=cabina" data-meta="praga" aria-label="Scopri Praga"><img src="../assets/foto/praga/hero.webp" alt="" /><span class="presa-label">Praga</span></a>
    <a class="presa" id="presa-budapest" href="arrivo.html?id=budapest&amp;da=cabina" data-meta="budapest" aria-label="Scopri Budapest"><img src="../assets/foto/budapest/hero.webp" alt="" /><span class="presa-label">Budapest</span></a>
    <a class="presa" id="presa-vienna" href="arrivo.html?id=vienna&amp;da=cabina" data-meta="vienna" aria-label="Scopri Vienna"><img src="../assets/foto/vienna/hero.webp" alt="" /><span class="presa-label">Vienna</span></a>
    <a class="presa" id="presa-parigi" href="arrivo.html?id=parigi&amp;da=cabina" data-meta="parigi" aria-label="Scopri Parigi"><img src="../assets/foto/parigi/hero.webp" alt="" /><span class="presa-label">Parigi</span></a>
    <a class="presa" id="presa-barcellona" href="arrivo.html?id=barcellona&amp;da=cabina" data-meta="barcellona" aria-label="Scopri Barcellona"><img src="../assets/foto/barcellona/hero.webp" alt="" /><span class="presa-label">Barcellona</span></a>
    <a class="presa" id="presa-lisbona" href="arrivo.html?id=lisbona&amp;da=cabina" data-meta="lisbona" aria-label="Scopri Lisbona"><img src="../assets/foto/lisbona/hero.webp" alt="" /><span class="presa-label">Lisbona</span></a>
    <a class="presa" id="presa-cracovia" href="arrivo.html?id=cracovia&amp;da=cabina" data-meta="cracovia" aria-label="Scopri Cracovia"><img src="../assets/foto/cracovia/hero.webp" alt="" /><span class="presa-label">Cracovia</span></a>
    <a class="presa" id="presa-madrid" href="arrivo.html?id=madrid&amp;da=cabina" data-meta="madrid" aria-label="Scopri Madrid"><img src="../assets/foto/madrid/hero.webp" alt="" /><span class="presa-label">Madrid</span></a>

  </div>
  </main>

  <nav class="cabina-comandi" aria-label="Navigazione nella cabina" hidden>
    <button type="button" id="cabinaPrev" aria-label="Destinazione precedente">←</button>
    <p>Scorri. Scegli. <span>Parti.</span></p>
    <button type="button" id="cabinaNext" aria-label="Destinazione successiva">→</button>
  </nav>

  <!-- L'orizzonte sta fuori dalla scena: e' lontanissimo, non si muove in modo
       percettibile, e dentro al contenitore che scorre allargava l'area di
       scorrimento di piu' di mille pixel. -->
  <div class="cielo" aria-hidden="true"></div>

  <!-- Ombre dei fianchi e vignettatura: fisse allo schermo, non scorrono -->
  <div class="vignetta" aria-hidden="true"></div>

  <!-- Dove Flip porta il mondo a fine corsa -->
  <div class="mondo-pieno" id="mondoPieno"></div>
  <button type="button" id="cabinaRitorno" class="cabina-ritorno" hidden>← Torna nella cabina</button>

  <script src="../js/vendor/gsap.min.js"></script>
  <script src="../js/vendor/Flip.min.js"></script>
  <script src="cabin.js"></script>
</body>
</html>
