# ===== WIP / MANUTENZIONE — INIZIO =====
# Per DISATTIVARE: commenta o elimina tutti i blocchi [[redirects]] qui sotto.
# Gli asset restano raggiungibili; ogni altra rotta va su /wip.html (302 temporaneo).
[[redirects]]
  from = "/wip.html"
  to = "/wip.html"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/wip.html"
  status = 302
  force = true
# ===== WIP / MANUTENZIONE — FINE =====
# NOTA: "elimina tutti i blocchi [[redirects]]" vale SOLO per quelli qui sopra.
# I due blocchi subito sotto NON vanno toccati: servono proprio dopo la fine del WIP.

# ===== Vecchie pagine di dettaglio -> template unico (Fase 1) =====
# viaggio-citybreak.html e viaggio-lastminute.html non esistono piu': tutto il dettaglio
# passa da viaggio.html. Netlify conserva la query string, quindi ?id=... sopravvive.
# Finche' il WIP qui sopra e' attivo questi blocchi restano dormienti: il 302 su /wip.html
# viene prima nell'ordine e vince. Tornano vivi quando il WIP viene rimosso.
[[redirects]]
  from = "/viaggio-citybreak.html"
  to = "/viaggio.html"
  status = 301
  force = true

[[redirects]]
  from = "/viaggio-lastminute.html"
  to = "/viaggio.html"
  status = 301
  force = true

# ===== File interni: mai scaricabili =====
# Oggi il redirect WIP li copre di rimbalzo (arriva prima nell'ordine), ma quando i blocchi
# qui sopra spariranno resterebbero serviti in chiaro. Sul sito di Francesco TASKS.md e'
# rimasto scaricabile per settimane esattamente cosi'.
[[redirects]]
  from = "/TASKS.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true

# ===== Protezione pannelli amministrativi (Edge Function) =====
# Credenziali (ADMIN_USER / ADMIN_PASS) da impostare in Netlify:
# Site settings > Environment variables — MAI nel repository.
[[edge_functions]]
  path = "/admin.html"
  function = "protect-admin"

[[edge_functions]]
  path = "/preventivi-manager.html"
  function = "protect-admin"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://formspree.io https://www.google-analytics.com; frame-ancestors 'self'"
